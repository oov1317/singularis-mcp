# Smithery configuration for the Singularis MCP server.
# Smithery reads this file when the repository is registered at smithery.ai/new.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        title: Singularis API key
        description: Optional. Leave empty and call singularis_register_key once to claim 500 free credits (US, first 1,000 agents).
      shellSecret:
        type: string
        title: Singularis shell secret
        description: Optional. Saved automatically by singularis_register_key together with the API key.
      country:
        type: string
        title: Country (ISO code)
        default: US
      engineCmd:
        type: string
        title: Singularis runtime command
        description: Command of the Singularis runtime on your machine. Jobs run on your machine; results depend on your equipment. You have the option of using a GPU for even greater results.
  commandFunction: |-
    (config) => ({
      command: "uvx",
      args: ["singularis-mcp"],
      env: {
        SINGULARIS_API_KEY: config.apiKey || "",
        SINGULARIS_SHELL_SECRET: config.shellSecret || "",
        SINGULARIS_COUNTRY: config.country || "US",
        SINGULARIS_ENGINE_CMD: config.engineCmd || ""
      }
    })
